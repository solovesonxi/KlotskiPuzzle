name: Bug report
description: Report a reproducible problem in the game, solver, build, or local data flow.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to provide a reproducible report.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the application with ...
        2. Choose ...
        3. Click ...
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version
      description: Paste the output of `java -version` (Java 22 or later is required).
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu 24.04, macOS 15, ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove passwords and private local data before attaching anything.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I can reproduce this on Java 22 or later.
          required: true
