<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description">
  <title id="title">KlotskiPuzzle board illustration</title>
  <desc id="description">A neutral five by four Klotski board beside labels for Java 22, Swing, A star search, and JUnit 5.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#2b183d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#080b12" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="960" height="420" rx="28" fill="url(#background)"/>
  <circle cx="845" cy="72" r="120" fill="#6d3fb1" opacity="0.14"/>
  <circle cx="105" cy="365" r="145" fill="#e36c45" opacity="0.10"/>

  <g font-family="Segoe UI, Arial, sans-serif" fill="#f7f8fc">
    <text x="80" y="110" font-size="47" font-weight="700">KlotskiPuzzle</text>
    <text x="80" y="151" font-size="21" fill="#c8cee0">A runnable Java desktop project for learning</text>
    <text x="80" y="180" font-size="21" fill="#c8cee0">board modeling, search, and Swing concurrency.</text>

    <g font-size="17" font-weight="600">
      <rect x="80" y="222" width="108" height="38" rx="19" fill="#e76f51"/>
      <text x="105" y="247">Java 22+</text>
      <rect x="200" y="222" width="90" height="38" rx="19" fill="#3c7dbd"/>
      <text x="221" y="247">Swing</text>
      <rect x="302" y="222" width="116" height="38" rx="19" fill="#7f58af"/>
      <text x="326" y="247">A* Search</text>
      <rect x="430" y="222" width="105" height="38" rx="19" fill="#288d70"/>
      <text x="453" y="247">JUnit 5</text>
    </g>

    <text x="80" y="315" font-size="18" fill="#aeb7cf">Shared rules  ·  Background solving  ·  Replayable paths</text>
  </g>

  <g transform="translate(655 40)" filter="url(#shadow)">
    <rect width="240" height="340" rx="18" fill="#0e1422" stroke="#66708a" stroke-width="3"/>
    <g stroke="#0e1422" stroke-width="7">
      <rect x="8" y="8" width="55" height="128" rx="11" fill="#4b83c3"/>
      <rect x="177" y="8" width="55" height="128" rx="11" fill="#4b83c3"/>
      <rect x="64" y="8" width="112" height="128" rx="12" fill="#d96852"/>
      <rect x="8" y="136" width="55" height="128" rx="11" fill="#5c91c9"/>
      <rect x="177" y="136" width="55" height="128" rx="11" fill="#5c91c9"/>
      <rect x="64" y="136" width="112" height="62" rx="11" fill="#8c65b7"/>
      <rect x="64" y="199" width="55" height="64" rx="11" fill="#d7a84f"/>
      <rect x="120" y="199" width="56" height="64" rx="11" fill="#d7a84f"/>
      <rect x="8" y="264" width="55" height="68" rx="11" fill="#d7a84f"/>
      <rect x="177" y="264" width="55" height="68" rx="11" fill="#d7a84f"/>
    </g>
    <path d="M94 315h52" stroke="#f0c46c" stroke-width="5" stroke-linecap="round"/>
    <path d="m132 302 14 13-14 13" fill="none" stroke="#f0c46c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
